name: Publish to npm

# The only place `npm publish` runs — npm's trusted-publisher (OIDC) config
# is bound to this exact repo + workflow filename, so publishing has to
# happen here, not in some other workflow. release.yml (bump/commit/tag on
# every push to main) triggers this via workflow_dispatch once it has
# pushed a new tag — a push made with the default GITHUB_TOKEN can't
# trigger this `push: tags:` clause itself, hence the explicit dispatch.
# The `push: tags:` trigger below is kept for a human pushing a `vX.Y.Z`
# tag by hand.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish (e.g. v0.1.0)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish
        run: npm publish --provenance --access public

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes

name: Release

# Bumps package.json, commits "chore: release vX.Y.Z", tags it, publishes to
# npm, and creates the GitHub release — all in one job, on every push to
# main. Everything happens here (rather than the tag push triggering
# publish.yml) because pushes made with the default GITHUB_TOKEN don't
# trigger other workflows, by GitHub's own loop-prevention design.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    # The release commit this job pushes re-triggers this workflow; skip it
    # instead of releasing forever.
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # Conventional-commits-ish, matched against the commit header only:
      # "feat:" -> minor, "<type>!:" -> major, a "BREAKING CHANGE:" footer
      # (start of a line, not just the phrase anywhere) -> major, else
      # patch. Only the first line is checked for the "!:" and "feat:"
      # forms so prose elsewhere in the body (like this comment) can't
      # accidentally match.
      - name: Determine version bump
        id: bump
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          HEADER=$(echo "$MESSAGE" | head -n1)
          if echo "$HEADER" | grep -qE '^[a-z]+(\(.+\))?!:' || echo "$MESSAGE" | grep -qE '^BREAKING CHANGE:'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$HEADER" | grep -qE '^feat(\(.+\))?:'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version, commit and tag
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ steps.bump.outputs.type }} -m "chore: release v%s"
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Push release commit and tag
        run: git push origin HEAD:main --follow-tags

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.version.outputs.tag }}" --title "${{ steps.version.outputs.tag }}" --generate-notes
